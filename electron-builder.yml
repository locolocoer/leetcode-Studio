appId: com.leetcodestudio.app
productName: LeetCode Studio
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/.npm-cache"
extraResources:
  - from: toolchains
    to: toolchains
    filter:
      - "**/*"
asar: true
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
  # 注意：文件名里不要出现空格，否则自动更新的 latest.yml 与真实文件名会不一致
  artifactName: LeetCode-Studio-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: LeetCode Studio
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # 自动更新：生成差分包 + 卸载时保留用户数据
  differentialPackage: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: LeetCode-Studio-${version}-portable.${ext}
mac:
  icon: build/icon.png
  target:
    - dmg
  category: public.app-category.developer-tools
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
# 发布目标：GitHub Releases（CI 生成 Release；如配置了镜像，客户端会优先走镜像）
publish:
  provider: github
  owner: locolocoer
  repo: leetcode-Studio
  releaseType: release
